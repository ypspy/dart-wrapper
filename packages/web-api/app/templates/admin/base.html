<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DART 수집 운영{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0 auto; padding: 24px; max-width: 1040px;
      font-family: "Segoe UI", system-ui, sans-serif; line-height: 1.5;
    }
    h1 { font-size: 1.4rem; }
    h2 { font-size: 1.1rem; margin-top: 32px; }
    form.inline { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
    label { display: flex; flex-direction: column; font-size: 0.85rem; gap: 4px; }
    input, select { padding: 6px 8px; font: inherit; }
    button { padding: 7px 14px; font: inherit; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 0.9rem; }
    th, td { border-bottom: 1px solid #8884; padding: 8px 6px; text-align: left; }
    .status { font-weight: 600; }
    .status-complete { color: #157347; }
    .status-blocked { color: #b5850b; }
    .status-failed { color: #b02a37; }
    .muted { color: #8a8a8a; font-size: 0.85rem; }
    .heatmap-scroll { overflow-x: auto; padding-bottom: 8px; }
    .heatmap-months {
      display: grid;
      grid-template-columns: 44px repeat(53, 11px);
      column-gap: 2px;
      min-width: 760px;
      height: 20px;
      font-size: 0.72rem;
      color: #656d76;
    }
    .heatmap-row {
      display: grid;
      grid-template-columns: 38px 18px auto;
      align-items: start;
      min-width: 760px;
      margin-bottom: 14px;
    }
    .heatmap-type { font-size: 0.75rem; padding-top: 2px; }
    .heatmap-days {
      display: grid;
      grid-template-rows: repeat(7, 11px);
      row-gap: 2px;
      font-size: 0.62rem;
      color: #656d76;
    }
    .heatmap-days span:nth-child(1) { grid-row: 2; }
    .heatmap-days span:nth-child(2) { grid-row: 4; }
    .heatmap-days span:nth-child(3) { grid-row: 6; }
    .heatmap-grid {
      display: grid;
      grid-template-rows: repeat(7, 11px);
      grid-auto-flow: column;
      grid-auto-columns: 11px;
      gap: 2px;
    }
    .heatmap-cell {
      display: inline-block;
      width: 11px;
      height: 11px;
      border-radius: 2px;
      box-sizing: border-box;
    }
    .heatmap-cell:hover { outline: 1px solid #1f2328; outline-offset: 1px; }
    .heatmap-complete { background: #2ea043; }
    .heatmap-incomplete { background: #d1242f; }
    .heatmap-missing { background: #ebedf0; }
    .heatmap-future { background: transparent; }
    .heatmap-legend {
      display: flex;
      justify-content: flex-end;
      gap: 14px;
      min-width: 760px;
      font-size: 0.75rem;
      color: #656d76;
    }
    .heatmap-legend span { display: inline-flex; align-items: center; gap: 5px; }
    .heatmap-legend .heatmap-cell:hover { outline: none; }
    @media (prefers-color-scheme: dark) {
      .heatmap-missing { background: #30363d; }
      .heatmap-cell:hover { outline-color: #f0f6fc; }
    }
  </style>
</head>
<body>
  <h1><a href="/admin">DART 수집 운영</a></h1>
  {% block content %}{% endblock %}
</body>
</html>
