<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DART 수집 운영{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0 auto; padding: 24px; max-width: 1480px;
      font-family: "Segoe UI", system-ui, sans-serif; line-height: 1.5;
    }
    h1 { font-size: 1.4rem; }
    h2 { font-size: 1.1rem; margin-top: 32px; }
    h3 { font-size: 0.95rem; margin: 24px 0 6px; }
    .ops-topbar {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 16px; border-bottom: 1px solid #8884; padding-bottom: 12px;
    }
    .ops-topbar h2 { margin: 0; }
    .ops-grid {
      display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(300px, 1fr);
      gap: 28px; align-items: start;
    }
    .ops-left h3:first-child, .ops-right h3:first-child { margin-top: 16px; }
    @media (max-width: 1100px) { .ops-grid { grid-template-columns: 1fr; } }
    .year-bar {
      display: flex; gap: 3px; align-items: flex-end;
      overflow-x: auto; padding-bottom: 4px;
    }
    .year-bar-item {
      flex: 1 0 16px; display: flex; flex-direction: column; align-items: center;
      gap: 3px; text-decoration: none; color: inherit; padding: 2px 1px;
      border-radius: 3px;
    }
    .year-bar-fill { display: block; width: 100%; border-radius: 2px; background: #ebedf0; }
    .year-bar-missing .year-bar-fill { height: 16px; }
    .year-bar-incomplete .year-bar-fill { height: 34px; background: #d1242f; }
    .year-bar-complete .year-bar-fill { height: 48px; background: #2ea043; }
    .year-bar-label { font-size: 0.62rem; color: #656d76; }
    .year-bar-item.is-selected { outline: 2px solid #0969da; outline-offset: 1px; }
    .job-card { border: 1px solid #8884; border-radius: 8px; padding: 12px 14px; }
    .job-card-head { display: flex; justify-content: space-between; align-items: center; }
    .job-chip {
      padding: 2px 9px; border-radius: 999px; font-size: 0.72rem;
      background: #8882; text-transform: uppercase;
    }
    .job-chip-running { background: #2ea04333; color: #157347; }
    .job-chip-failed { background: #d1242f33; color: #b02a37; }
    .job-progress {
      height: 6px; margin: 10px 0; border-radius: 999px;
      background: #8883; overflow: hidden;
    }
    .job-progress i { display: block; height: 100%; background: #0969da; }
    .job-meta { display: grid; gap: 4px; margin: 0 0 10px; font-size: 0.8rem; }
    .job-meta div { display: flex; gap: 8px; }
    .job-meta dt { color: #8a8a8a; min-width: 42px; }
    .job-meta dd { margin: 0; }
    .job-error { color: #b02a37; font-size: 0.8rem; }
    .job-log-list { list-style: none; margin: 0; padding: 0; font-size: 0.78rem; }
    .job-log { display: flex; gap: 8px; padding: 3px 0; border-bottom: 1px solid #8882; }
    .job-log-level { flex: 0 0 44px; color: #8a8a8a; }
    .job-log-warn .job-log-level { color: #b5850b; }
    .job-log-error .job-log-level { color: #b02a37; }
    .collect-form { border: 1px solid #8884; border-radius: 8px; padding: 10px 14px; }
    .collect-form summary { cursor: pointer; font-weight: 600; }
    .collect-form form { display: grid; gap: 10px; margin-top: 8px; }
    .collect-form label.checkbox { flex-direction: row; align-items: center; gap: 6px; }
    .slice-chips { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; margin: 0; padding: 0; }
    .slice-chip {
      border-left: 3px solid #d1242f; background: #8881;
      border-radius: 4px; font-size: 0.78rem;
    }
    .slice-chip a { display: block; padding: 4px 8px; color: inherit; text-decoration: none; }
    .slice-chip-blocked { border-left-color: #b5850b; }
    .slices-summary form.inline { margin: 10px 0; }
    .slices-full summary { cursor: pointer; font-size: 0.85rem; color: #656d76; }
    form.inline { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
    label { display: flex; flex-direction: column; font-size: 0.85rem; gap: 4px; }
    input, select { padding: 6px 8px; font: inherit; }
    button { padding: 7px 14px; font: inherit; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 0.9rem; }
    th, td { border-bottom: 1px solid #8884; padding: 8px 6px; text-align: left; }
    .status { font-weight: 600; }
    .status-complete { color: #157347; }
    .status-blocked { color: #b5850b; }
    .status-failed { color: #b02a37; }
    .muted { color: #8a8a8a; font-size: 0.85rem; }
    .heatmap-scroll { overflow-x: auto; padding-bottom: 8px; }
    .heatmap-months {
      display: grid;
      grid-template-columns: 54px repeat(54, 11px);
      column-gap: 2px;
      min-width: 760px;
      height: 20px;
      font-size: 0.72rem;
      color: #656d76;
    }
    .heatmap-row {
      display: grid;
      grid-template-columns: 38px 18px auto;
      align-items: start;
      min-width: 760px;
      margin-bottom: 14px;
    }
    .heatmap-type { font-size: 0.75rem; padding-top: 2px; }
    .heatmap-days {
      display: grid;
      grid-template-rows: repeat(7, 11px);
      row-gap: 2px;
      font-size: 0.62rem;
      color: #656d76;
    }
    .heatmap-days span:nth-child(1) { grid-row: 2; }
    .heatmap-days span:nth-child(2) { grid-row: 4; }
    .heatmap-days span:nth-child(3) { grid-row: 6; }
    .heatmap-grid {
      display: grid;
      grid-template-rows: repeat(7, 11px);
      grid-auto-flow: column;
      grid-auto-columns: 11px;
      gap: 2px;
    }
    .heatmap-cell {
      display: inline-block;
      width: 11px;
      height: 11px;
      border-radius: 2px;
      box-sizing: border-box;
    }
    .heatmap-cell:hover { outline: 1px solid #1f2328; outline-offset: 1px; }
    .heatmap-complete { background: #2ea043; }
    .heatmap-incomplete { background: #d1242f; }
    .heatmap-missing { background: #ebedf0; }
    .heatmap-future { background: transparent; }
    .heatmap-legend {
      display: flex;
      justify-content: flex-end;
      gap: 14px;
      min-width: 760px;
      font-size: 0.75rem;
      color: #656d76;
    }
    .heatmap-legend span { display: inline-flex; align-items: center; gap: 5px; }
    .heatmap-legend .heatmap-cell:hover { outline: none; }
    .heatmap-future:hover { outline: none; }
    @media (prefers-color-scheme: dark) {
      .heatmap-missing { background: #30363d; }
      .heatmap-cell:hover { outline-color: #f0f6fc; }
    }
  </style>
</head>
<body>
  <h1><a href="/admin">DART 수집 운영</a></h1>
  {% block content %}{% endblock %}
</body>
</html>
