<div class="job-logs">
  {% if job and job.status in ("pending", "running") %}
  <p class="muted job-logs-hint">실행 중 · info/warn/error 표시 · 5초마다 갱신</p>
  {% else %}
  <p class="muted job-logs-hint">대기 중 · warn/error만 표시</p>
  {% endif %}
  {% if logs %}
  <ul class="job-log-list">
    {% for log in logs %}
    <li class="job-log job-log-{{ log.level }}">
      <span class="job-log-level">{{ log.level|upper }}</span>
      <span class="job-log-message">{{ log.message }}</span>
    </li>
    {% endfor %}
  </ul>
  {% else %}
  <p class="muted">표시할 로그가 없습니다.</p>
  {% endif %}
</div>
