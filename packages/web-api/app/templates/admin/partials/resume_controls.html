{% if job_busy %}
<p class="banner-warn">진행 중인 작업이 있어 이어하기를 시작할 수 없습니다.</p>
{% endif %}
<form class="inline" method="post" action="/admin/resume">
  <input type="hidden" name="report_type" value="{{ report_type }}">
  <button type="submit" class="btn btn-primary"{% if job_busy %} disabled{% endif %}>미완료 이어하기</button>
</form>
{% if not job_busy %}
<p class="muted">선택한 유형({{ report_type }})의 미완료·차단 슬라이스를 이어서 처리합니다.</p>
{% endif %}
