<div class="collect-form">
  <p class="muted">
    기본 기간은 연구 창입니다. 유형은 감사·연결감사·사업보고서만 고를 수 있습니다.
  </p>
  {% if catalog_busy %}
  <p class="banner-warn">수집 중이니 추출을 시작할 수 없습니다.</p>
  {% elif extract_busy %}
  <p class="banner-warn">추출 작업이 진행 중이라 새 추출을 시작할 수 없습니다.</p>
  {% endif %}
  <form method="post" action="/admin/extract/start">
    <label>
      시작일
      <input type="text" name="start_date" value="{{ start_date }}" pattern="\d{8}" required>
    </label>
    <label>
      종료일
      <input type="text" name="end_date" value="{{ end_date }}" pattern="\d{8}" required>
    </label>
    <fieldset>
      <legend>공시 유형</legend>
      {% for option in extract_report_type_options %}
      <label class="checkbox">
        <input type="checkbox" name="report_types" value="{{ option.code }}"
               {% if option.code in report_types %} checked{% endif %}>
        {{ option.code }} · {{ option.label }}
      </label>
      {% endfor %}
    </fieldset>
    <label>
      모드
      <select name="mode">
        <option value="extract"{% if mode == "extract" %} selected{% endif %}>extract · 신규</option>
        <option value="resume"{% if mode == "resume" %} selected{% endif %}>resume · 재개</option>
        <option value="reparse"{% if mode == "reparse" %} selected{% endif %}>reparse · 재파싱</option>
      </select>
    </label>
    <button type="submit" class="btn btn-primary"{% if catalog_busy or extract_busy %} disabled{% endif %}>
      추출 시작
    </button>
  </form>
</div>
